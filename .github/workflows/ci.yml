name: USJ FOE Resource Portal CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-ci:
    name: Backend Quality & Pytest Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: usj_resource_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest-cov

      - name: Run Backend Pytest Suite
        working-directory: ./backend
        env:
          ENVIRONMENT: testing
          DATABASE_URL: postgresql+asyncpg://postgres:postgres_ci_password@localhost:5432/usj_resource_test_db
          JWT_SECRET_KEY: ci_test_jwt_secret_usj_foe_2026_super_secure_key
          RATE_LIMITING_ENABLED: true
        run: |
          pytest -v --cov=app --cov-report=term-missing tests/

  frontend-ci:
    name: Frontend Quality & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript Type Check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Run Frontend Test Suite
        working-directory: ./frontend
        run: npm test

      - name: Run Next.js Production Build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.usj-resources.lk/api/v1
        run: npm run build
